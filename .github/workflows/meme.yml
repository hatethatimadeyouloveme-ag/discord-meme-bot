name: Reddit Meme ke Discord

on:
  schedule:
    - cron: "0 */6 * * *"   # tiap 6 jam (UTC). Ubah sesuai kebutuhan
  workflow_dispatch:         # biar bisa dijalankan manual dari tab Actions

jobs:
  post-meme:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil meme dan kirim ke Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          # Coba sampai 5x supaya dapat meme yang bukan NSFW
          for i in 1 2 3 4 5; do
            RESP=$(curl -fsS "https://meme-api.com/gimme/memes")
            NSFW=$(echo "$RESP" | jq -r '.nsfw')
            [ "$NSFW" = "false" ] && break
          done

          if [ "$NSFW" != "false" ]; then
            echo "Tidak dapat meme aman, dilewati."
            exit 0
          fi

          jq -n --argjson m "$RESP" '{
            username: "Meme Bot",
            embeds: [{
              title: $m.title,
              url: $m.postLink,
              image: { url: $m.url },
              color: 16729344,
              footer: { text: ("r/" + $m.subreddit + " | upvote: " + ($m.ups | tostring)) }
            }]
          }' | curl -fsS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
